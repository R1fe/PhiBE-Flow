project:
  name: video-gen-with-phibe
  dataset: acrobot_frames

dataset:
  name: acrobot_frames
  dataset_path: data/acrobot_frames
  mode: window # image, pair, window, trajectory
  image_size: 32
  normalize: true # The from-scratch codec uses [-1, 1].
  seq_length: 2
  prediction_horizon: 1
  time_lag: 1
  stride: 1
  time_delta: 1.0 # Time per raw frame; default unit is one frame.
  time_origin: 0.0
  max_frames: null
  preload: false
  train_ratio: 0.8
  test_ratio: 0.2
  seed: 42
  batch_size: 32
  num_workers: 0

codec:
  type: mlp # mlp, gpe, torchscript
  initialization: random # random: train reconstruction; pretrained: freeze supplied codec
  trust_external_code: false
  source_dir: external/GPE_codes
  source_file: transportmodules/transportsMNIST.py
  encoder_class: TransportT
  decoder_class: TransportG
  encoder_checkpoint: null
  decoder_checkpoint: null

model:
  latent_dim: 8
  width: 128
  time_scale: 30.0

training:
  seed: 42
  device: auto
  codec_epochs: 5
  codec_lr: 0.001
  epochs: 20
  lr: 0.0003
  max_grad_norm: 1.0
  include_diffusion: true
  checkpoint_path: null
  load_weights_only: false

visualization:
  enabled: true
  every_n_epochs: 1
  num_fixed_test_samples: 2
  rollout_plot_frames: 8
  fps: 10

evaluation:
  checkpoint: last.pt
  horizons: [1]
  fvd: false

paths:
  checkpoint_dir: experiments/acrobot_frames/checkpoints
  log_dir: experiments/acrobot_frames/logs
  result_dir: experiments/acrobot_frames/results
  figure_dir: experiments/acrobot_frames/figures
