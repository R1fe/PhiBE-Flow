project:
  name: video-gen-with-phibe
  dataset: acrobot_frames
dataset:
  name: acrobot_frames
  dataset_path: data/acrobot_frames
  mode: window
  image_size: 32
  normalize: true
  seq_length: 2
  prediction_horizon: 6
  time_lag: 1
  stride: 4
  time_delta: 1.0
  time_origin: 0.0
  max_frames: 24
  preload: false
  train_ratio: 0.8
  test_ratio: 0.2
  seed: 42
  batch_size: 8
  num_workers: 0
model:
  latent_dim: 8
  width: 64
  time_scale: 30.0
training:
  seed: 42
  device: cpu
  codec_epochs: 3
  codec_lr: 0.001
  epochs: 3
  lr: 0.0003
  max_grad_norm: 1.0
  include_diffusion: true
  checkpoint_path: null
  load_weights_only: false
visualization:
  enabled: true
  every_n_epochs: 1
  num_fixed_test_samples: 1
  rollout_plot_frames: 8
  fps: 10
evaluation:
  checkpoint: last.pt
  horizons: [1, 3, 6]
  fvd: false
paths:
  checkpoint_dir: experiments/acrobot_frames_smoke/checkpoints
  log_dir: experiments/acrobot_frames_smoke/logs
  result_dir: experiments/acrobot_frames_smoke/results
  figure_dir: experiments/acrobot_frames_smoke/figures
notes:
  status: pipeline_smoke_test_only
  comment: No pretrained weights; small independent codec, not the GPE paper experiment.
